openapi: 3.1.0
info:
  title: AD Platform Participant API
  version: 2.0.0
  summary: Participant-facing API for attack-defense automation
  description: >
    Participant API for authentication, player registration, team join, target
    discovery, whitebox source download, flag submission, service unlock, SSH
    access, and service recovery workflows.
servers:
  - url: https://api.example.com
    description: Replace with the real participant API host
tags:
  - name: Authentication
  - name: Discovery
  - name: Submission
  - name: Services
paths:
  /api/v2/authenticate:
    post:
      tags:
        - Authentication
      summary: Authenticate team member
      description: Exchange team-member credentials for a participant JWT.
      operationId: authenticateParticipant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateRequest'
            examples:
              default:
                value:
                  email: alpha.captain@example.com
                  password: alpha-secret
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateResponse'
              examples:
                default:
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                    token_type: Bearer
        '400':
          description: Invalid request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidRequest:
                  value:
                    title: Invalid request
                    status: 400
                    detail: email and password are required.
        '403':
          description: Invalid credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                wrongCredentials:
                  value:
                    title: Authentication failed
                    status: 403
                    detail: email or password is wrong.
        '429':
          description: Authentication rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/register:
    post:
      tags:
        - Authentication
      summary: Register a participant account
      description: >
        Creates a participant account without assigning a team. The participant
        receives a bearer token but must join a team before accessing event
        resources such as challenges, services, submissions, and WireGuard VPN.
      operationId: registerParticipant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantRegisterRequest'
      responses:
        '200':
          description: Registration succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateResponse'
        '400':
          description: Invalid or duplicate registration
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Registration rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/me/team:
    post:
      tags:
        - Authentication
      summary: Join a team after signing in
      description: >
        Attaches the authenticated participant account to the team identified by
        the unique team key. This is the normal next action after registering or
        signing in without a team.
      operationId: joinTeamForCurrentParticipant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantJoinExistingTeamRequest'
      responses:
        '200':
          description: Team join succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateResponse'
        '400':
          description: Invalid request, already joined, or full team
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Bearer token missing/invalid or team key invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/me/profile:
    put:
      tags:
        - Authentication
      summary: Update current participant and team profile
      description: >
        Updates the authenticated participant display name/email and, when the
        participant belongs to a team, the current team name/contact email.
        Returns a refreshed participant JWT containing the updated claims.
      operationId: updateCurrentParticipantProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantUpdateProfileRequest'
      responses:
        '200':
          description: Profile update succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticateResponse'
        '400':
          description: Invalid request or duplicate player/team value
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Bearer token missing/invalid or organizer token used
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/session:
    get:
      tags:
        - Authentication
      summary: Validate bearer token and return current participant profile
      description: |
        Used by the web frontend on page load to confirm a stored token is still
        valid and to populate the participant's team/role context. Re-validates
        against the store on every call (a deleted player returns 403 even if
        the JWT itself is still valid). Peserta tidak perlu panggil endpoint ini
        secara langsung; itu dipakai oleh web frontend saat page load.
      operationId: getSession
      responses:
        '200':
          description: Token valid; returns the participant profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantSession'
              examples:
                default:
                  value:
                    player_id: 1
                    team_id: 101
                    team_name: Team Alpha
                    team_contact_email: team-alpha@example.com
                    display_name: Alpha Captain
                    email: alpha.captain@example.com
                    role: captain
        '403':
          description: Token missing, invalid, expired, or player no longer in store.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/challenges:
    get:
      tags:
        - Discovery
      summary: List published challenges
      operationId: listChallenges
      responses:
        '200':
          description: Challenge catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Challenge'
              examples:
                default:
                  value:
                    - id: 1
                      name: banking
                      has_source_download: true
                    - id: 2
                      name: chat
                      has_source_download: false
        '429':
          description: Challenge polling rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/challenges/{challenge_id}/source:
    get:
      tags:
        - Discovery
      summary: Download whitebox source bundle
      description: >
        Download the shared whitebox source bundle for a challenge. The response
        may be a streamed archive file or a configured artifact file.
      operationId: downloadChallengeSource
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
      responses:
        '200':
          description: Source bundle stream
          content:
            application/gzip:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unauthenticated:
                  value:
                    title: Forbidden
                    status: 403
                    detail: please authenticate before source access.
        '404':
          description: Source bundle unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/me/wireguard:
    get:
      tags:
        - Connection
      summary: Download own WireGuard config
      description: >
        Return the generated WireGuard peer config for the authenticated
        player. The response body is the full client .conf text and the
        Content-Disposition header carries the suggested filename
        `<peer_name>.conf`. Organizer accounts do not have a peer config
        and receive 403.
      operationId: downloadMyWireGuardConfig
      security:
        - bearerAuth: []
      responses:
        '200':
          description: WireGuard peer config
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'Suggested filename, formatted as attachment with the peer name.'
          content:
            text/plain:
              schema:
                type: string
                examples:
                  default:
                    value: |
                      # AD Platform WireGuard peer: alpha-captain
                      [Interface]
                      PrivateKey = ...
                      Address = 10.70.0.20/32
                      DNS = 1.1.1.1

                      [Peer]
                      PublicKey = ...
                      PresharedKey = ...
                      AllowedIPs = 10.70.0.0/16,10.80.0.0/16
                      Endpoint = vpn.adplatform.local:51820
                      PersistentKeepalive = 25
        '403':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: WireGuard config unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/services:
    get:
      tags:
        - Discovery
      summary: List published service targets
      description: >
        Return WireGuard-reachable service endpoints grouped by challenge ID and
        team ID.
      operationId: listServiceTargets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Published service targets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesByChallenge'
              examples:
                default:
                  value:
                    "1":
                      "101":
                        - 10.80.1.11:10001
                      "102":
                        - 10.80.1.12:10001
                    "2":
                      "101":
                        - 10.80.2.11:10002
                      "102":
                        - 10.80.2.12:10002
        '403':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unauthenticated:
                  value:
                    title: Forbidden
                    status: 403
                    detail: please authenticate before access.
        '429':
          description: Service polling rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/scoreboard:
    get:
      tags:
        - Discovery
      summary: Get scoreboard snapshot
      operationId: getScoreboard
      responses:
        '200':
          description: Scoreboard rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoreRow'
              examples:
                default:
                  value:
                    - rank: 1
                      team: Team Alpha
                      attack: 1840
                      defense: 910
                      sla: 780
                      total: 3530
                      delta: "+2"
        '429':
          description: Scoreboard polling rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/game/status:
    get:
      tags:
        - Discovery
      summary: Get public game status
      description: Get public match state, scheduler state, and current tick.
      operationId: getGameStatus
      responses:
        '200':
          description: Public game status snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatus'
              examples:
                running:
                  value:
                    match:
                      state: running
                      started_at: 2026-03-10T10:00:00Z
                      accepting_submissions: true
                    current_tick:
                      id: 248
                      status: completed
                    scheduler:
                      state: running
                      interval_seconds: 60
                      last_tick_id: 248
                    total_ticks: 248
                finished:
                  value:
                    match:
                      state: finished
                      started_at: 2026-03-10T10:00:00Z
                      ended_at: 2026-03-10T12:00:00Z
                      accepting_submissions: false
                    current_tick:
                      id: 250
                      status: completed
                    scheduler:
                      state: stopped
                      interval_seconds: 60
                      last_tick_id: 250
                    total_ticks: 250
        '429':
          description: Game status polling rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/attacks:
    get:
      tags:
        - Discovery
      summary: Get accepted attack feed
      operationId: getAttackFeed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 12
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: attacker
          in: query
          schema:
            type: string
          description: Case-insensitive substring filter on attacker team name.
        - name: victim
          in: query
          schema:
            type: string
          description: Case-insensitive substring filter on victim team name.
        - name: service
          in: query
          schema:
            type: string
          description: Case-insensitive substring filter on service name.
        - name: tick_from
          in: query
          schema:
            type: integer
            minimum: 0
          description: Inclusive lower bound for attack tick.
        - name: tick_to
          in: query
          schema:
            type: integer
            minimum: 0
          description: Inclusive upper bound for attack tick.
      responses:
        '200':
          description: Accepted attack page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttackFeedPage'
              examples:
                default:
                  value:
                    items:
                      - id: atk-1
                        attacker: Team Alpha
                        victim: Team Delta
                        service: banking
                        tick: 248
                        verdict: first valid submission accepted
                    limit: 12
                    offset: 0
                    total_count: 1
                    has_prev: false
                    has_next: false
        '429':
          description: Attack feed polling rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/submit:
    post:
      tags:
        - Submission
      summary: Submit flags
      description: >
        Submit one or more candidate flags. The request succeeds at the HTTP
        layer when the batch is processed; each flag receives its own result.
      operationId: submitFlags
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFlagsRequest'
              examples:
                default:
                  value:
                    flags:
                      - "PLAYIT{Zm9vOmJhcjoxMjM0NTY3ODkw.YWJjZGVm}"
                      - "PLAYIT{eHl6OmJhcjoxMjM0NTY3ODkw.bXlrZXlz}"
      responses:
        '200':
          description: Submission batch processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
              examples:
                default:
                  value:
                    results:
                      - flag: "PLAYIT{Zm9vOmJhcjoxMjM0NTY3ODkw.YWJjZGVm}"
                        status: invalid
                        detail: flag is wrong or expired.
                      - flag: "PLAYIT{eHl6OmJhcjoxMjM0NTY3ODkw.bXlrZXlz}"
                        status: accepted
                        detail: flag is correct.
                      - flag: "PLAYIT{eHl6OmJhcjoxMjM0NTY3ODkw.bXlrZXlz}"
                        status: duplicate
                        detail: flag already submitted.
                    accepted_count: 1
                    rejected_count: 2
        '400':
          description: Submission rejected before processing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidPayload:
                  value:
                    title: Invalid request
                    status: 400
                    detail: request body is invalid.
                notStarted:
                  value:
                    title: Submission rejected
                    status: 400
                    detail: contest has not started yet.
                contestOver:
                  value:
                    title: Submission rejected
                    status: 400
                    detail: contest is over.
        '403':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unauthenticated:
                  value:
                    title: Forbidden
                    status: 403
                    detail: please authenticate before submit.
        '429':
          description: Submission rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/team/services:
    get:
      tags:
        - Services
      summary: Get own service state
      operationId: listOwnServiceStates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Owned service state rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamServiceState'
              examples:
                default:
                  value:
                    - challenge_id: 1
                      team_id: 101
                      name: banking
                      endpoint: 10.80.1.11:10001
                      status: stable
                      checker: passing
                      unlocked: true
                      ssh_hint: ssh root@10.80.1.11 -p 22
                      last_event: nginx.conf hotfix deployed 2m ago
                      reset_cooldown: ready
                      sla_status: ok
                      sla_phase: check
                      sla_tick_id: 248
                      sla_message: service passed storage, retrieval, and functionality checks
        '403':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unauthenticated:
                  value:
                    title: Forbidden
                    status: 403
                    detail: please authenticate before access.
  /api/v2/services/{challenge_id}/unlock:
    post:
      tags:
        - Services
      summary: Unlock owned service
      description: Submit proof recovered from your own service to unlock SSH access.
      operationId: unlockService
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockRequest'
            examples:
              default:
                value:
                  proof: extracted-unlock-secret
      responses:
        '200':
          description: Service unlock accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnlockData'
              examples:
                default:
                  value:
                    challenge_id: 1
                    team_id: 101
                    unlocked: true
        '400':
          description: Invalid unlock request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                invalidProof:
                  value:
                    title: Request rejected
                    status: 400
                    detail: unlock proof is invalid.
        '403':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unauthenticated:
                  value:
                    title: Forbidden
                    status: 403
                    detail: please authenticate before unlock.
        '429':
          description: Unlock rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/services/{challenge_id}/ssh-session:
    post:
      tags:
        - Services
      summary: Get team SSH credential
      description: >
        Return the stable per-team SSH credential for an already-unlocked owned
        service.
      operationId: createSshSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
      responses:
        '200':
          description: SSH credential issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshSessionData'
              examples:
                default:
                  value:
                    challenge_id: 1
                    host: 10.80.1.11
                    port: 22
                    username: root
                    password: stable-team-root-password
                    password_mode: stable
                    connection_hint: ssh root@10.80.1.11 -p 22
        '400':
          description: Service not unlocked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                locked:
                  value:
                    title: Request rejected
                    status: 400
                    detail: service is not unlocked yet.
        '403':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unauthenticated:
                  value:
                    title: Forbidden
                    status: 403
                    detail: please authenticate before requesting ssh access.
        '429':
          description: SSH request rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/services/{challenge_id}/reset/factory:
    post:
      tags:
        - Services
      summary: Factory reset owned service
      description: Recreate the owned service from the baseline image.
      operationId: factoryResetService
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
      responses:
        '200':
          description: Factory reset triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryResetData'
              examples:
                default:
                  value:
                    challenge_id: 1
                    team_id: 101
                    action: factory_reset
                    unlock_preserved: true
        '403':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unauthenticated:
                  value:
                    title: Forbidden
                    status: 403
                    detail: please authenticate before reset.
        '429':
          description: Reset rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v2/services/{challenge_id}/reset/restart:
    post:
      tags:
        - Services
      summary: Restart owned service
      description: Restart the owned service without discarding filesystem changes.
      operationId: restartService
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
      responses:
        '200':
          description: Restart triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestartData'
              examples:
                default:
                  value:
                    challenge_id: 1
                    team_id: 101
                    action: restart
        '403':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                unauthenticated:
                  value:
                    title: Forbidden
                    status: 403
                    detail: please authenticate before restart.
        '429':
          description: Restart rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ChallengeId:
      name: challenge_id
      in: path
      required: true
      description: Stable challenge identifier
      schema:
        type: integer
        minimum: 1
  schemas:
    ProblemDetails:
      type: object
      additionalProperties: false
      required:
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    AuthenticateRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    ParticipantRegisterRequest:
      type: object
      additionalProperties: false
      required:
        - display_name
        - email
        - password
      properties:
        display_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    ParticipantJoinExistingTeamRequest:
      type: object
      additionalProperties: false
      required:
        - team_key
      properties:
        team_key:
          type: string
          minLength: 1
          description: Unique team join key issued by the organizer.
    ParticipantUpdateProfileRequest:
      type: object
      additionalProperties: false
      required:
        - display_name
        - email
      properties:
        display_name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        team_name:
          type: string
          minLength: 1
          description: Required when the participant has joined a team.
        team_contact_email:
          type: string
          format: email
          description: Required when the participant has joined a team.
    AuthenticateResponse:
      type: object
      additionalProperties: false
      required:
        - token
        - token_type
      properties:
        token:
          type: string
          description: Participant JWT
        token_type:
          type: string
          const: Bearer
    ParticipantSession:
      type: object
      additionalProperties: false
      required:
        - player_id
        - team_id
        - team_name
        - team_contact_email
        - display_name
        - email
        - role
      properties:
        player_id:
          type: integer
          description: Authenticated player's id (used to scope requests).
        team_id:
          type: integer
          description: Owning team id; organizer tokens report 0.
