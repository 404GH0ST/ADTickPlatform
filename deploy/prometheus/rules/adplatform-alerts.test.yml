# promtool unit tests for adplatform-alerts.yml.
#
# Run with:  make test-alerts
# (pulls a one-shot prom/prometheus:v2.55.1 image; no host install needed).
#
# Each test case feeds synthetic metric series and asserts which alerts
# the rules produce at the given eval_time. Catches:
#   - rules with broken PromQL syntax
#   - rules referencing metrics that don't exist in the time series
#   - rules that fail to fire under their target condition
#   - rules with wrong `for:` duration
#   - rules with wrong labels / annotations

rule_files:
  - adplatform-alerts.yml

evaluation_interval: 1m

tests:
  # --- AdplatformServiceDown --------------------------------------------------
  # up{job="adplatform-services"} == 0 for 1m should fire.
  - interval: 1m
    name: ServiceDown_FiresAfterOneMinute
    input_series:
      - series: 'up{job="adplatform-services",instance="api-gateway:8080"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: AdplatformServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: api-gateway:8080
            exp_annotations:
              summary: "Service api-gateway:8080 is down"
              description: "api-gateway:8080 has been unreachable for 1 minute."

  # --- AdplatformServiceDown --------------------------------------------------
  # Negative case: short blip (< 1m) must NOT fire (the `for: 1m` clause).
  - interval: 1m
    name: ServiceDown_DoesNotFireForShortBlip
    input_series:
      - series: 'up{job="adplatform-services",instance="api-gateway:8080"}'
        values: '1x5 0 1x5'
    alert_rule_test:
      - eval_time: 6m
        alertname: AdplatformServiceDown
        exp_alerts: []

  # --- AdplatformPrometheusTargetFailing ------------------------------------
  # up{job="adplatform-rate-limit"} == 0 for 1m should fire.
  - interval: 1m
    name: RateLimitScrapeDown
    input_series:
      - series: 'up{job="adplatform-rate-limit",instance="api-gateway:8080"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: AdplatformPrometheusTargetFailing
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: api-gateway:8080
            exp_annotations:
              summary: "Rate-limit metrics scrape failing"
              description: "api-gateway /internal/v1/rate-limit/metrics has been unreachable for 1 minute."

  # --- AdplatformRateLimitSustainedSpike ------------------------------------
  # Sum-by-endpoint of increase(...[1m]) > 30, sustained 3m.
  # Counter starts at 0, then jumps by 50 every minute from t=2m onwards.
  # increase(...[1m]) = 50 > 30 for t >= 2m. Sustained through t=4m → fires.
  - interval: 1m
    name: RateLimitSustainedSpike
    input_series:
      - series: 'adplatform_rate_limit_exceeded_total{endpoint="submit"}'
        values: '0 0 50 100 150 200 250'
    alert_rule_test:
      - eval_time: 5m
        alertname: AdplatformRateLimitSustainedSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              endpoint: submit
            exp_annotations:
              summary: "Sustained 429 spike on submit"
              description: "Endpoint submit is rejecting > 30 req/min for 3+ minutes. Either raise the policy or investigate the caller."

  # --- AdplatformRateLimitSustainedSpike (negative) -------------------------
  # Increase is below 30 → does not fire even after 3m.
  - interval: 1m
    name: RateLimitBelowThreshold
    input_series:
      - series: 'adplatform_rate_limit_exceeded_total{endpoint="submit"}'
        values: '0 5 10 15 20 25 30 35 40 45 50'
    alert_rule_test:
      - eval_time: 10m
        alertname: AdplatformRateLimitSustainedSpike
        exp_alerts: []

  # --- AdplatformSubmitFailureRate ------------------------------------------
  # Failure ratio > 25% for 5m. requests=100/min, failures=40/min.
  # ratio = 40/(100+40) = 28.6% > 25%, sustained from t=3m onwards.
  - interval: 1m
    name: SubmitFailureRate
    input_series:
      - series: 'adplatform_submission_service_submit_requests_total'
        values: '0 0 100 100 100 100 100 100 100'
      - series: 'adplatform_submission_service_submit_failures_total'
        values: '0 0 40 40 40 40 40 40 40'
    alert_rule_test:
      - eval_time: 8m
        alertname: AdplatformSubmitFailureRate
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Submission failure rate > 25%"
              description: "More than a quarter of submit requests are failing. Check game-core reachability and Redis."

  # --- AdplatformSchedulerStuck ---------------------------------------------
  # Scheduler running but next run overdue by 10+ minutes (alert threshold).
  # seconds_until_next_run values: 0, -100, ..., -1100 over 7 evaluations.
  # At t=6m, value is -900 (< -600) and `for: 2m` has elapsed → fires.
  - interval: 1m
    name: SchedulerStuck
    input_series:
      - series: 'adplatform_game_core_scheduler_running'
        values: '1x10'
      - series: 'adplatform_game_core_scheduler_seconds_until_next_run'
        values: '0 -100 -300 -500 -700 -900 -1100 -1300 -1500 -1700'
    alert_rule_test:
      - eval_time: 6m
        alertname: AdplatformSchedulerStuck
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Game scheduler stuck"
              description: "Scheduler reports running but the next run is overdue by 10+ minutes. Investigate checker-runner health."

  # --- AdplatformSchedulerStuck (negative) ---------------------------------
  # Scheduler running but next run is only ~3 minutes overdue → does NOT fire.
  - interval: 1m
    name: SchedulerSlightlyLate
    input_series:
      - series: 'adplatform_game_core_scheduler_running'
        values: '1x10'
      - series: 'adplatform_game_core_scheduler_seconds_until_next_run'
        values: '0 -50 -100 -150 -200 -250 -300 -350 -400 -450'
    alert_rule_test:
      - eval_time: 10m
        alertname: AdplatformSchedulerStuck
        exp_alerts: []

  # --- AdplatformScoringAuditMismatch --------------------------------------
  # last_audit_mismatches > 0 for 5m. Value is 5 from t=2m onwards.
  # At t=7m, condition has been true for 5m → fires.
  - interval: 1m
    name: ScoringAuditMismatch
    input_series:
      - series: 'adplatform_scoring_worker_last_audit_mismatches'
        values: '0 0 5 5 5 5 5 5 5 5'
    alert_rule_test:
      - eval_time: 7m
        alertname: AdplatformScoringAuditMismatch
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Scoring replay audit mismatches > 0"
              description: "Scoring recompute and replay disagree on 5 rows. Investigate before publishing scores."
