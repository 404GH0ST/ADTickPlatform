services:
  web:
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      AD_PLATFORM_CONTROLLER_URL: ${CONTROLLER_INTERNAL_URL_HOST:-http://host.docker.internal:18084}
      AD_PLATFORM_CONTROLLER_METRICS_URL: ${CONTROLLER_INTERNAL_URL_HOST:-http://host.docker.internal:18084}
      AD_PLATFORM_WIREGUARD_GATEWAY_URL: ${WIREGUARD_GATEWAY_INTERNAL_URL_HOST:-http://host.docker.internal:18087}

  postgres:
    ports:
      - 127.0.0.1:${POSTGRES_LOOPBACK_PORT:-15432}:5432

  checker-runner:
    ports:
      - 127.0.0.1:${CHECKER_RUNNER_LOOPBACK_PORT:-18083}:8083

  docker-socket-proxy:
    ports:
      - 127.0.0.1:${DOCKER_SOCKET_PROXY_LOOPBACK_PORT:-12375}:2375
    networks:
      - docker-control
      - control

  api-gateway:
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      CONTROLLER_INTERNAL_URL: ${CONTROLLER_INTERNAL_URL_HOST:-http://host.docker.internal:18084}
      WIREGUARD_GATEWAY_INTERNAL_URL: ${WIREGUARD_GATEWAY_INTERNAL_URL_HOST:-http://host.docker.internal:18087}

  controller-service:
    networks: !reset []
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      CONTROLLER_SERVICE_ADDR: ${CONTROLLER_SERVICE_ADDR_HOST:-:18084}
      POSTGRES_DSN: ${POSTGRES_DSN_HOST_ENFORCEMENT:-postgres://adplatform:change-this-postgres-password@127.0.0.1:15432/adplatform?sslmode=disable}
      CHECKER_RUNNER_INTERNAL_URL: ${CHECKER_RUNNER_INTERNAL_URL_HOST:-http://127.0.0.1:18083}
      CONTROLLER_ACCESS_MODE: ${CONTROLLER_ACCESS_MODE:-host}
      CONTROLLER_ACCESS_INTERFACE: ${CONTROLLER_ACCESS_INTERFACE:-wg0}
      CONTROLLER_ACCESS_FIREWALL_BACKEND: ${CONTROLLER_ACCESS_FIREWALL_BACKEND:-iptables}
      CONTROLLER_ACCESS_NFT_BIN: ${CONTROLLER_ACCESS_NFT_BIN:-nft}
      CONTROLLER_ACCESS_IPTABLES_BIN: ${CONTROLLER_ACCESS_IPTABLES_BIN:-iptables}
      CONTROLLER_ACCESS_FIREWALL_TABLE: ${CONTROLLER_ACCESS_FIREWALL_TABLE:-adplatform_service_access}
      CONTROLLER_ACCESS_RULES_PATH: /runtime/controller/access.nft
      CONTROLLER_ACCESS_STATUS_PATH: /runtime/controller/access-status.json
      CONTROLLER_ACCESS_TIMEOUT: ${CONTROLLER_ACCESS_TIMEOUT:-10s}
      WIREGUARD_GATEWAY_INTERNAL_URL: ${CONTROLLER_WIREGUARD_GATEWAY_INTERNAL_URL_HOST:-http://127.0.0.1:18087}
      WIREGUARD_GATEWAY_INTERNAL_TOKEN: ${WIREGUARD_GATEWAY_INTERNAL_TOKEN}
      DOCKER_HOST: ${CONTROLLER_DOCKER_HOST:-tcp://127.0.0.1:12375}

  wireguard-gateway:
    networks: !reset []
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      WIREGUARD_GATEWAY_ADDR: ${WIREGUARD_GATEWAY_ADDR_HOST:-:18087}
      POSTGRES_DSN: ${POSTGRES_DSN_HOST_ENFORCEMENT:-postgres://adplatform:change-this-postgres-password@127.0.0.1:15432/adplatform?sslmode=disable}
      WIREGUARD_GATEWAY_MODE: ${WIREGUARD_GATEWAY_MODE:-host}
      WIREGUARD_GATEWAY_INTERFACE: ${WIREGUARD_GATEWAY_INTERFACE:-wg0}
      WIREGUARD_GATEWAY_WG_BIN: ${WIREGUARD_GATEWAY_WG_BIN:-wg}
      WIREGUARD_GATEWAY_FIREWALL_BACKEND: ${WIREGUARD_GATEWAY_FIREWALL_BACKEND:-nftables}
      WIREGUARD_GATEWAY_NFT_BIN: ${WIREGUARD_GATEWAY_NFT_BIN:-nft}
      WIREGUARD_GATEWAY_FIREWALL_TABLE: ${WIREGUARD_GATEWAY_FIREWALL_TABLE:-adplatform_wireguard}
      WIREGUARD_GATEWAY_APPLY_TIMEOUT: ${WIREGUARD_GATEWAY_APPLY_TIMEOUT:-10s}

  prometheus:
    extra_hosts:
      - host.docker.internal:host-gateway
