# Auto-provisioned Prometheus datasource for Grafana.
# Grafana reads this on boot so dashboards work out of the box.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
